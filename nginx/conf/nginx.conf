# Static base config. Per-site files in sites/ are generated by kshrd.ps1.
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    ssl_certificate      ../../certs/kshrd.app.pem;
    ssl_certificate_key  ../../certs/kshrd.app-key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    server {
        listen       127.0.0.2:80 default_server;
        server_name  _;
        return       301 https://$host$request_uri;
    }

    # Hostnames that are not registered get no response.
    server {
        listen       127.0.0.2:443 ssl default_server;
        server_name  _;
        ssl_reject_handshake on;
    }

    include sites/*.conf;
}
